name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  cpp:
    name: allocator utility (g++)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile with warnings as errors
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Isrc/agri_swarm_allocation/include \
            src/agri_swarm_allocation/test/test_utility.cpp \
            -o test_utility
      - name: Run
        run: ./test_utility

  python:
    name: offline maths (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run tests
        run: python -m pytest tests/ -q

  static:
    name: syntax + manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every Python file parses
        run: python -m compileall -q src analysis experiments tests
      - name: Every package.xml is well-formed
        run: |
          python - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          bad = []
          for p in glob.glob("src/*/package.xml"):
              try:
                  ET.parse(p)
              except ET.ParseError as e:
                  bad.append((p, e))
          if bad:
              print(bad); sys.exit(1)
          print(f"{len(glob.glob('src/*/package.xml'))} manifests OK")
          PY

  ros:
    name: workspace builds (ROS 2 Jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          path: src_checkout

      # colcon expects packages under src/. The repo already has that layout,
      # so the checkout is moved rather than copied package by package.
      - name: Lay out the workspace
        run: |
          mkdir -p ws
          mv src_checkout/src ws/src
          mv src_checkout ws/repo

      # This is the step that justifies the job. rosdep resolves what the
      # manifests declare, so a dependency used in code but missing from a
      # package.xml fails here and nowhere else.
      - name: Resolve declared dependencies
        shell: bash
        working-directory: ws
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy \
            --skip-keys "ros_gz_sim ros_gz_bridge"

      # ros_gz is skipped above: it pulls the whole Gazebo stack, which is a
      # large download for a job that never renders anything. agri_swarm_bringup
      # depends on it at exec time only, so the build does not need it.
      - name: colcon build
        shell: bash
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+

      # Importing the generated message package is the cheapest proof that
      # rosidl actually produced something, not just that CMake succeeded.
      - name: Generated interfaces import
        shell: bash
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -c "
          from agri_swarm_msgs.msg import (
              Bid, RobotState, SwarmEvent, TaskAnnouncement, TaskAward,
              Treatment, WeedDetection)
          f = SwarmEvent.get_fields_and_field_types()
          assert len(f) == 12, f
          assert SwarmEvent.EVENT_SPLIT_BRAIN == 2
          print('7 interfaces import; SwarmEvent has', len(f), 'fields')
          "

      # The launch file is executed, not merely parsed: a missing import or a
      # typo in an argument name only shows up when it is described.
      - name: Launch file is describable
        shell: bash
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 launch agri_swarm_bringup swarm.launch.py --show-args
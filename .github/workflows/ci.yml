name: unit tests (ROS-free)

# Deliberately honest scope: this workflow does NOT build the ROS 2 packages.
# No colcon, no Gazebo, no rclcpp. It runs the parts of the repo that were
# written to be testable without them:
#
#   * agri_swarm_allocation/include/.../utility.hpp   -- the bid ablation
#   * agri_swarm_core/.../pure_pursuit.py             -- lane + control maths
#   * analysis/score_run.py                           -- the offline scorer
#   * generate_field.py determinism
#
# A green badge here means the maths is right. It does not mean the system
# runs. Do not let it imply otherwise in the README.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  cpp:
    name: allocator utility (g++)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile with warnings as errors
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Isrc/agri_swarm_allocation/include \
            src/agri_swarm_allocation/test/test_utility.cpp \
            -o test_utility
      - name: Run
        run: ./test_utility

  python:
    name: offline maths (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run tests
        run: python -m pytest tests/ -q

  static:
    name: syntax + manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every Python file parses
        run: python -m compileall -q src analysis experiments tests
      - name: Every package.xml is well-formed
        run: |
          python - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          bad = []
          for p in glob.glob("src/*/package.xml"):
              try:
                  ET.parse(p)
              except ET.ParseError as e:
                  bad.append((p, e))
          if bad:
              print(bad); sys.exit(1)
          print(f"{len(glob.glob('src/*/package.xml'))} manifests OK")
          PY
